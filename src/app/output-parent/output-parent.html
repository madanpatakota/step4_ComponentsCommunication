<div class="container mt-5">
    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
            <i class="bi bi-phone me-2"></i>
            Parent Component – Message Receiver
        </div>

        <div class="card-body">
           
            <!-- Child Component -->

            <div class="m-4">
                <!-- Hi, How Are you ?? -->
            <app-output-child 
            (traditionalEmployeeAction)="receiveTraditionalOutput($event)"
            (ModrenEmployeeAction)     ="receiveModrenOutput($event)"
            
            >

            </app-output-child>
            </div>

            <div class="col-md-6 mb-3">
                <div class="card border-primary h-100">

                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-phone-vibrate me-2"></i>
                        Parent Phone – @Output()
                    </div>

                    <div class="card-body">
                        <p class="text-muted">
                            Message received from the child:
                        </p>

                        <div class="alert alert-primary mb-0">
                            <i class="bi bi-chat-left-text me-2"></i>
                            <!-- Message from Child -->
                             {{receivedtraditionalMessage}}
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
